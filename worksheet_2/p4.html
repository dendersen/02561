<!DOCTYPE html>
<html>
  <head>
    <title>My Page</title>
    <script type="text/javascript" src="../MV.js"></script>
    <script type="text/javascript" src="../drawingAssist.js"></script>
    <script type="text/javascript" src="../main.js"></script>
    <script type="text/javascript" src="p4.js"></script>
    <script id="wgsl" type="x-shader" src="../p.wgsl"></script>
  </head>
  <body>
    <canvas id="my-canvas" width="512" height="512" onclick="onClick(event)" onmousemove="onMouseMove(event)">
      Please use a browser that supports HTML5 canvas.
    </canvas>
    <br>
    <button onclick="clearCanvas()">reset & update canvas</button>
    <input type="color" id="canvas-color" value="#6495ED"">
    <br>point color
    <input type="color" id="point-color" value="#000000"">
    <br>
    click effect:
    <select type="select" id="click-effect" onchange="updateClickEffect()">
      <option value="points">points</option>
      <option value="triangles">triangles</option>
      <option value="circles">circles</option>
    </select>
  </body>
</html>
